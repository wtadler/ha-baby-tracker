[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
# The vendored library is linted in its own repo.
extend-exclude = ["custom_components/nighp_baby_tracker/pybabytracker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "D"]
# Home Assistant core's docstring ignores.
ignore = ["D202", "D203", "D213", "D406", "D407", "D417"]

[tool.ruff.lint.per-file-ignores]
# Test names carry the intent; core's own test suite is the only place D applies to tests.
"tests/**" = ["D"]

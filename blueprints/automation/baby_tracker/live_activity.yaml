blueprint:
  name: Baby Tracker (Nighp) live activity
  description: >
    Shows a running sleep or nursing timer as an iOS Live Activity (a Live Update on Android)
    through the Home Assistant Companion app. It starts when a timer starts, updates the side when
    nursing switches sides, and ends when the timer stops. Create one automation per baby.
    Every input after the notify service is optional: an icon and color for each activity, a
    dashboard path to open when the activity is tapped, and a sleep detail entity (such as a
    bassinet's state) whose state replaces "Asleep" while a sleep runs. Starts alert; side
    switches and detail changes update the activity silently, and a detail change only counts once
    it has held for 15 seconds.
    Needs Home Assistant 2026.7.0 or later and a Companion app with Live Activity support.
  domain: automation
  source_url: https://github.com/wtadler/ha-baby-tracker/blob/main/blueprints/automation/baby_tracker/live_activity.yaml
  input:
    sleep_timer:
      name: Sleep timer
      description: The baby's "Sleep timer" sensor.
      selector:
        entity:
          domain: sensor
          integration: baby_tracker
          device_class: timestamp
    nursing_timer:
      name: Nursing timer
      description: The same baby's "Nursing timer" sensor.
      selector:
        entity:
          domain: sensor
          integration: baby_tracker
          device_class: timestamp
    notify_service:
      name: Notify service
      description: >
        The Companion app's notify action for the phone, such as notify.mobile_app_your_phone.
        Find it in the app under Settings, Companion app, Server & devices.
      selector:
        text:
    sleep_title:
      name: Sleep title
      description: The static header of the sleep activity. It can't change once started.
      default: Sleeping
      selector:
        text:
    nursing_title:
      name: Nursing title
      description: The static header of the nursing activity. It can't change once started.
      default: Nursing
      selector:
        text:
    sleep_icon:
      name: Sleep icon
      description: The icon shown on the sleep activity.
      default: mdi:sleep
      selector:
        icon:
    nursing_icon:
      name: Nursing icon
      description: The icon shown on the nursing activity.
      default: mdi:mother-nurse
      selector:
        icon:
    sleep_color:
      name: Sleep icon color
      description: "A hex color for the sleep icon, such as #7E57C2."
      default: "#7E57C2"
      selector:
        text:
    nursing_color:
      name: Nursing icon color
      description: "A hex color for the nursing icon, such as #EC407A."
      default: "#EC407A"
      selector:
        text:
    tap_link:
      name: Tap link
      description: >
        A dashboard path to open when the activity is tapped, such as /lovelace/baby. Leave it
        empty to open the app's default screen.
      default: ""
      selector:
        text:
    sleep_detail:
      name: Sleep detail
      description: >
        An optional entity, such as a bassinet's state. While a sleep runs, its displayed state
        becomes the sleep activity's message, updated silently once a new state has held for 15
        seconds. Leave it empty to keep "Asleep".
      default: ""
      selector:
        entity:
          multiple: false

# Queued, not parallel or single: the start, the side switches, and the end of one timer must
# reach the notify service in the order they happened (a parallel stop could overtake its own
# start and leave an activity running), and none may be dropped (single would drop a stop that
# arrives while the start is still being sent). A queue of 10 is far more than the few events a
# timer produces.
mode: queued
max: 10

# The detail input reaches the event trigger below as a template, so any empty form the editor
# or hand-written YAML might store (omitted, null, "", whitespace, [], [""]) means "no detail
# entity" instead of making the whole automation invalid.
trigger_variables:
  detail_input: !input sleep_detail
  detail_entity: >-
    {% set d = detail_input[0] if detail_input is not string and detail_input else detail_input %}
    {{ (d | string | trim) if d else '' }}

variables:
  sleep_timer: !input sleep_timer
  nursing_timer: !input nursing_timer
  sleep_title: !input sleep_title
  nursing_title: !input nursing_title
  # A blank icon or color, or a color that isn't #RGB or #RRGGBB, falls back to the default.
  sleep_icon_input: !input sleep_icon
  nursing_icon_input: !input nursing_icon
  sleep_color_input: !input sleep_color
  nursing_color_input: !input nursing_color
  sleep_icon: "{{ (sleep_icon_input | string | trim if sleep_icon_input else '') or 'mdi:sleep' }}"
  nursing_icon: >-
    {{ (nursing_icon_input | string | trim if nursing_icon_input else '') or 'mdi:mother-nurse' }}
  sleep_color: >-
    {% set c = sleep_color_input | string | trim if sleep_color_input else '' %}
    {{ c if c | regex_match('^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$') else '#7E57C2' }}
  nursing_color: >-
    {% set c = nursing_color_input | string | trim if nursing_color_input else '' %}
    {{ c if c | regex_match('^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$') else '#EC407A' }}
  tap_link: !input tap_link
  # One tag per baby and timer, from the entity id (letters, numbers, and underscores only).
  sleep_tag: "{{ ('sleep_' ~ sleep_timer.split('.')[1])[:64] }}"
  nursing_tag: "{{ ('nursing_' ~ nursing_timer.split('.')[1])[:64] }}"

trigger:
  - trigger: state
    entity_id: !input sleep_timer
    id: sleep
  - trigger: state
    entity_id: !input nursing_timer
    id: nursing
  # The optional sleep detail entity, as a state_changed event filtered by a templated entity id.
  # Unset, the id is empty and no event matches. The 15-second hold is in the action below.
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ detail_entity }}"
    id: detail

action:
  - variables:
      not_running: ["unknown", "unavailable", "none", ""]
      was_running: >-
        {{ trigger.id != 'detail' and trigger.from_state is not none
           and trigger.from_state.state not in not_running }}
      is_running: >-
        {{ trigger.id != 'detail' and trigger.to_state is not none
           and trigger.to_state.state not in not_running }}
      is_detail: "{{ trigger.id == 'detail' }}"
      is_nursing: "{{ trigger.id == 'nursing' }}"
      tag: "{{ nursing_tag if is_nursing else sleep_tag }}"
      title: "{{ nursing_title if is_nursing else sleep_title }}"
      # The sleep timer's start time, whichever trigger fired.
      timer_state: >-
        {{ states(sleep_timer) if is_detail else
           (trigger.to_state.state if trigger.to_state is not none else '') }}
      sleep_running: "{{ is_detail and timer_state not in not_running }}"
      icon: "{{ nursing_icon if is_nursing else sleep_icon }}"
      color: "{{ nursing_color if is_nursing else sleep_color }}"
      # The Live Activity payload. The tap link is left out when empty.
      live_data: >-
        {{ {'tag': tag, 'live_update': true, 'chronometer': true,
            'when': as_timestamp(timer_state, none), 'notification_icon': icon,
            'notification_icon_color': color}
           | combine({'url': tap_link} if tap_link else {}) }}
      side: >-
        {{ (trigger.to_state.attributes.get('side') or '') if is_running else '' }}
      message: >-
        {{ 'Nursing · ' ~ side | capitalize ~ ' side' if is_nursing and side else
           ('Nursing' if is_nursing else 'Asleep') }}
  - choose:
      # Started: from no timer to a start time.
      - conditions: "{{ is_running and not was_running }}"
        sequence:
          - action: !input notify_service
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data: "{{ live_data }}"
      # Stopped: the timer went to unknown, from a running timer or from unavailable (a failed sync
      # mid-timer goes running, unavailable, unknown). A clear for a tag with no activity is harmless.
      - conditions: >-
          {{ not is_detail and trigger.to_state is not none and trigger.to_state.state == 'unknown'
             and trigger.from_state is not none and trigger.from_state.state != 'unknown' }}
        sequence:
          - action: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ tag }}"
      # Switched sides: still running, and the side changed.
      - conditions: >-
          {{ is_running and was_running and is_nursing
             and trigger.from_state.attributes.get('side') != trigger.to_state.attributes.get('side') }}
        sequence:
          - action: !input notify_service
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data: "{{ live_data | combine({'silent': true}) }}"
      # The sleep detail changed while a sleep runs. Wait until the new state has held for 15
      # seconds (some devices flap), then update the message if it still stands: unchanged since
      # the event, and the sleep still running. The wait ends early when either stops being true,
      # so a stop or a newer change never sits in the queue behind it, and a change overtaken by
      # a newer one is dropped (the newer one's own run sends it).
      - conditions: >-
          {{ is_detail and sleep_running
             and trigger.event.data.new_state is not none
             and trigger.event.data.old_state is not none
             and trigger.event.data.new_state.state not in not_running
             and trigger.event.data.old_state.state != trigger.event.data.new_state.state
             and states[detail_entity].last_changed == trigger.event.data.new_state.last_changed }}
        sequence:
          - variables:
              changed_at: "{{ trigger.event.data.new_state.last_changed.timestamp() }}"
          - wait_template: >-
              {{ states[detail_entity].last_changed.timestamp() != changed_at
                 or states(sleep_timer) in not_running }}
            timeout:
              seconds: "{{ [0, 15 - (as_timestamp(now()) - changed_at)] | max }}"
            continue_on_timeout: true
          - condition: template
            value_template: >-
              {{ states[detail_entity].last_changed.timestamp() == changed_at
                 and states(sleep_timer) not in not_running }}
          - action: !input notify_service
            data:
              title: "{{ title }}"
              message: "{{ state_translated(detail_entity) }}"
              data: >-
                {{ live_data | combine({'when': as_timestamp(states(sleep_timer), none),
                                        'silent': true}) }}

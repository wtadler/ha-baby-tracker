  config.step.user.data.password: "[%key:common::config_flow::data::password%]"
  config.step.reauth_confirm.data.password: "[%key:common::config_flow::data::password%]"
  config.error.invalid_auth: "[%key:common::config_flow::error::invalid_auth%]"
  config.error.cannot_connect: "[%key:common::config_flow::error::cannot_connect%]"

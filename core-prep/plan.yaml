  config.abort.reauth_successful: "[%key:common::config_flow::abort::reauth_successful%]"

# Strings worded differently until a later PR: `until` is the PR that brings the repository's
# wording back.
overrides:
  exceptions.auth_failed.message:
    until: 2
    text: "The service rejected the email or password. Remove the entry and add the account again with its current password."


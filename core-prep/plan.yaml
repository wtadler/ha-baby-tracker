# The core pull request sequence, as data for scripts/core_cut.py.
#
# Every value is the planned core PR that brings an item into core (1 to 22), or `hacs` for an
# item that stays in this repository. A cut for PR N writes everything planned for PRs 1 to N.
# Python code inside a file is cut by markers in the source: see scripts/core_cut.py.

prs: 22

# Files of custom_components/nighp_baby_tracker/. strings.json, icons.json, services.yaml,
# manifest.json, and quality_scale.yaml are generated, so they aren't listed.
integration_files:
  __init__.py: 1
  const.py: 1
  coordinator.py: 1
  entity.py: 1
  sensor.py: 1
  config_flow.py: 1
  diagnostics.py: 3
  helpers.py: 4
  totals.py: 7
  binary_sensor.py: 8
  services.py: 9
  writes.py: 9
  button.py: 14
  bottle.py: 15
  switch.py: 17
  timers.py: 18
  timer_state.py: 18
  guard.py: 18
  brand: hacs
  pybabytracker: hacs
  translations: hacs

# Files of tests/ whose module docstring doesn't name their PR. A test module's docstring starts
# with "Core PR N" (or "Core PRs N, ...", which means the first of them) or "HACS only".
test_files:

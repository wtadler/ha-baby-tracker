rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Polls every 5 minutes, fixed (no option changes it), and every minute only while a sleep or nursing timer runs.
  brands:
    status: done
    comment: brand/icon.png and icon@2x.png, the app's official App Store icon, used for identification only (as the brands repository's trademark notice describes). The icon doubles as the logo. Move to the brands repository at core submission.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: Library bundled while private; goes to PyPI at go-public (#12).
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration registers no device conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration registers no device triggers.
  entity-event-setup:
    status: exempt
    comment: Entities read the coordinator's data and subscribe to no events of their own.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: Every module of the integration is at 95% or above (98% overall), measured without the bundled library, whose client and CLI are tested in the library's own repository.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud account has no devices to discover on a network, so there is no address to update.
  discovery:
    status: exempt
    comment: A cloud account has no devices to discover on a network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations:
    status: done
    comment: The README's Known limitations section gathers them.
  docs-supported-devices:
    status: exempt
    comment: The integration connects to an account in the app's cloud service. The babies it shows as devices are records in that account, not physical devices.
  docs-supported-functions: done
  docs-troubleshooting:
    status: done
    comment: The README's Troubleshooting section covers reauthentication, both repairs, stale sensors, and diagnostics.
  docs-use-cases:
    status: done
    comment: The README's Use cases section gives five, with automation examples.
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: Every entity (the buttons, the last-activity and timer sensors, and the asleep sensor) is a primary entity, for which the default category is right.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: No entity starts disabled. The timer sensors drive the live activity blueprint, and the diaper buttons are the integration's main use, so none is a less popular entity.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The only settings in the config flow are the account's credentials, and the reauthentication flow handles the password. A different email is a different account, which gets its own entry.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: mypy --strict passes on the integration in CI, but it skips the bundled library's types, and sensor.py still probes record fields with getattr. Finish when the library is a PyPI package that ships py.typed (#12).

log_diaper:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: nighp_baby_tracker
    type:
      required: true
      example: wet
      selector:
        select:
          translation_key: diaper_type
          options:
            - wet
            - dirty
            - mixed
    time:
      required: false
      selector:
        datetime:
    note:
      required: false
      example: Rash cream applied
      selector:
        text:
    object_id:
      required: false
      example: 6F1C2A3E-0000-4000-8000-000000000002
      selector:
        text:

log_bottle:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: nighp_baby_tracker
    kind:
      required: true
      example: formula
      selector:
        select:
          translation_key: bottle_kind
          options:
            - formula
            - pumped
    amount:
      required: true
      example: 4
      selector:
        number:
          min: 0
          max: 100000
          step: any
    unit:
      required: false
      example: fl. oz.
      selector:
        select:
          options:
            - fl. oz.
            - mL
    time:
      required: false
      selector:
        datetime:
    note:
      required: false
      example: Fussy at the end
      selector:
        text:
    object_id:
      required: false
      example: 6F1C2A3E-0000-4000-8000-000000000003
      selector:
        text:

